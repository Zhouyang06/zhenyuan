<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>管理处 — ZhenYuan</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/admin.css?v=5">
</head>
<body class="admin-body">

  <!-- 密码门 -->
  <div id="gate" class="gate">
    <form id="gate-form" class="gate-card">
      <h1>Control</h1>
      <p class="gate-hint">仅站点所有者可进入</p>
      <input type="password" id="gate-pwd" placeholder="访问密码" autocomplete="current-password" required>
      <button type="submit">进入</button>
      <p id="gate-err" class="gate-err"></p>
    </form>
  </div>

  <!-- 编辑器（面包屑 + 灰导航 + Control 标题 + 黑菜单列/灰内容区） -->
  <div id="editor" class="editor" hidden>
    <p class="admin-crumb" id="crumb">管理处</p>

    <nav class="admin-nav">
      <strong class="admin-site">ZHENYUAN</strong>
      <div class="admin-nav-right">
        <a href="index.html" target="_blank">首页</a>
        <a href="menu.html" target="_blank">Menus</a>
        <a href="works.html" target="_blank">作品</a>
        <a href="social.html" target="_blank">社交平台</a>
        <a href="javascript:void 0" id="pub-toggle">发布设置</a>
        <button id="save-btn" class="admin-save">保存并发布</button>
      </div>
    </nav>

    <!-- 发布设置（GitHub Pages 部署时需要；本机预览无需填写） -->
    <div id="pub-setup" class="pub-setup" hidden>
      <label class="field"><span class="field-key">仓库（用户名/仓库名）</span>
        <input type="text" id="gh-repo" placeholder="例如：zhenyuan/zhenyuan.github.io"></label>
      <label class="field"><span class="field-key">GitHub Token（仅本次会话，不落盘）</span>
        <input type="password" id="gh-token" placeholder="ghp_…（需要 Contents 读写权限）"></label>
      <p class="pub-hint">本机预览（127.0.0.1）自动使用本地保存接口，无需填写；部署到 GitHub Pages 后，保存与上传走 GitHub API，需要填写以上两项。</p>
    </div>

    <header class="admin-head"><h1>Control</h1></header>

    <div class="admin-panel">
      <aside class="admin-menu" id="admin-menu"></aside>
      <main class="admin-content" id="admin-content"></main>
    </div>

    <p id="status" class="status"></p>
  </div>

  <script src="js/admin.js?v=7"></script>
</body>
</html>
